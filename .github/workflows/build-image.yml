# Buduje obraz LLM do pisania tekstów piosenek: oficjalny runpod-workers/worker-vllm (vLLM OpenAI server + wrapper
# RunPod Serverless) z WYPIECZONYM modelem (build-arg MODEL_NAME), żeby cold start nie pobierał wag z Hugging Face.
# Uruchomienie: Actions -> "Build lyrics LLM worker image" -> Run workflow (tag, model), albo push taga v*.
# Obraz: ghcr.io/<owner>/lyrics-llm-worker:<tag>  (~28 GB: vllm-openai ~11 GB + wagi modelu; v1 = Gemma 4 E4B bf16 16 GB,
# v2 = Gemma 4 26B-A4B int4 QAT 17 GB)
name: Build lyrics LLM worker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag obrazu (np. v2)"
        required: true
        default: "v2"
      model_name:
        description: "Repo HF modelu do wypieczenia"
        required: true
        default: "cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4"
      worker_vllm_ref:
        description: "Tag runpod-workers/worker-vllm"
        required: true
        default: "v2.27.0"
      vllm_version:
        description: "Wersja vLLM (obraz bazowy vllm/vllm-openai)"
        required: true
        default: "v0.29.0"
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 6144
          temp-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          build-mount-path: /var/lib/docker

      - name: Restart docker on the new mount
        run: |
          sudo systemctl restart docker
          df -h / /var/lib/docker

      - uses: actions/checkout@v4

      - name: Checkout runpod-workers/worker-vllm
        uses: actions/checkout@v4
        with:
          repository: runpod-workers/worker-vllm
          ref: ${{ inputs.worker_vllm_ref || 'v2.27.0' }}
          path: worker-vllm

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT";
          else echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"; fi
          echo "model=${{ inputs.model_name || 'cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4' }}" >> "$GITHUB_OUTPUT"
          echo "vllm=${{ inputs.vllm_version || 'v0.29.0' }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/lyrics-llm-worker" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: worker-vllm
          file: worker-vllm/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VLLM_VERSION=${{ steps.meta.outputs.vllm }}
            MODEL_NAME=${{ steps.meta.outputs.model }}
            BASE_PATH=/models

      - name: Summary
        run: |
          echo "IMAGE=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "MODEL=${{ steps.meta.outputs.model }}" >> "$GITHUB_STEP_SUMMARY"
